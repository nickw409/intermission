# Secret scan on every branch push (audit finding SA4-3). ci.yml scans main and PRs; this
# catches a secret on a feature branch as soon as it is pushed, before any PR exists.
name: secrets-push
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read

jobs:
  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
