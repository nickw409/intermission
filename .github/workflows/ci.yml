# CI for every push and PR. WIRING file (orchestrator-owned).
# Every action is pinned to a full commit SHA (public repo: supply-chain hygiene).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: tools/contracts/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: tools/contracts
      - run: npm run validate
        working-directory: tools/contracts

  cpp:
    name: cpp (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/deps.cmake') }}
      - run: cmake --preset ${{ matrix.preset }} -DRECS_GIT_SHA=${{ github.sha }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: tools/contracts/package-lock.json }
      - name: Validate reports written by the test run
        run: |
          if [ -d build/${{ matrix.preset }}/test-reports ]; then
            npm ci --ignore-scripts --prefix tools/contracts
            node tools/contracts/validate-reports.mjs build/${{ matrix.preset }}/test-reports
          else
            echo "no test-reports directory yet"
          fi

  cpp-fuzz-build:
    name: cpp (fuzz build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build clang libomp-dev
      - run: cmake --preset fuzz && cmake --build --preset fuzz

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.3', cache-dependency-path: api/go.sum }
      - run: make -C api check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run check
        working-directory: web
