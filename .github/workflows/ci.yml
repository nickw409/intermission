# CI for every push and PR. WIRING file (orchestrator-owned).
# Every action is pinned to a full commit SHA (public repo: supply-chain hygiene).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  contracts:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: tools/contracts/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: tools/contracts
      - run: npm run validate
        working-directory: tools/contracts

  cpp:
    name: cpp (${{ matrix.preset }})
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/deps.cmake') }}
      # Compiler cache: a PR recompiles only the translation units it changed. Every run
      # restores the newest cache from main; only pushes to main save one, so PR pushes never
      # evict main's entries (caches are scoped per branch; main's are readable by PRs).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - run: >-
          cmake --preset ${{ matrix.preset }} -DRECS_GIT_SHA=${{ github.sha }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: ccache -z && cmake --build --preset ${{ matrix.preset }} && ccache --show-stats
        env: { CCACHE_DIR: '${{ github.workspace }}/.ccache', CCACHE_MAXSIZE: 1G, CCACHE_BASEDIR: '${{ github.workspace }}' }
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
      - run: ctest --preset ${{ matrix.preset }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: tools/contracts/package-lock.json }
      - name: Validate reports written by the test run
        run: |
          if [ -d build/${{ matrix.preset }}/test-reports ]; then
            npm ci --ignore-scripts --prefix tools/contracts
            node tools/contracts/validate-reports.mjs build/${{ matrix.preset }}/test-reports
          else
            echo "no test-reports directory yet"
          fi

  cpp-fuzz-build:
    name: cpp (fuzz build)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build clang libomp-dev ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/_deps
          key: deps-fuzz-${{ hashFiles('cmake/deps.cmake') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - run: >-
          cmake --preset fuzz -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          && ccache -z && cmake --build --preset fuzz && ccache --show-stats
        env: { CCACHE_DIR: '${{ github.workspace }}/.ccache', CCACHE_MAXSIZE: 1G, CCACHE_BASEDIR: '${{ github.workspace }}' }
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-fuzz-${{ github.sha }}
      # Deterministic gate: every committed corpus input (including saved crash regressions)
      # must still pass. Random fuzzing runs weekly in security-scan.yml with a recorded seed,
      # so this required check can't fail on luck.
      - name: Replay fuzz corpora
        run: tools/fuzz/replay.sh 0
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: fuzz-out, path: build/fuzz/fuzz-out, retention-days: 7 }

  go:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4', cache-dependency-path: api/go.sum }
      - run: make -C api check

  web:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run check
        working-directory: web
