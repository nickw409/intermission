# Release images and deploy gates. Owned by workstream M (deploy).
#
# On every push to main: build all five images tagged with the short SHA
# (intermission-{api,model,train,web,backup}:<sha>), run the image and edge gates against
# them, and keep the image set as a workflow artifact for 7 days.
# On every pull request: the same gates, without the artifact. Both jobs are required checks on
# main, so the workflow must run on every PR (a path filter would leave them pending forever);
# the images are built from all of the code, not just deploy/.
#
# Publishing (#97), push to main only, after both gates pass:
#   publish  builds the set natively on amd64 and on arm64 (production is a Raspberry Pi 4),
#            re-runs the image and edge gates on each, and pushes
#            ghcr.io/nickw409/intermission-<name>:<sha>-<arch>.
#            The pushed digests travel to `sign` as a run artifact, never by tag: any workflow
#            with packages: write could move a tag in between.
#   sign     joins the two digests into one image index per name,
#            ghcr.io/nickw409/intermission-<name>:<sha>, signs each index digest with cosign
#            keyless signing (identity: this workflow on refs/heads/main), then verifies it with
#            the exact policy deploy/fetch-images.sh uses, so a signature the host cannot verify
#            fails here, not on the host.
# Only these two jobs get `packages: write`, and only `sign` gets `id-token: write`. They never
# run on pull requests. The packages are public: the images hold no secrets and no MovieLens data.
#
# Every action is pinned to a full commit SHA.
name: release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Pushes get one group per commit, so no main run is ever cancelled or dropped from the queue
  # (each commit gets its gates and its published image set). PR runs share a group per ref and
  # superseded ones are cancelled.
  group: release-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-config:
    name: deploy (compose, scripts, backup tool, alert rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Compose hardening and published-port gate
        run: python3 deploy/tests/check_compose.py
      - name: shellcheck
        run: shellcheck -x deploy/*.sh deploy/tests/*.sh
      - name: lib.sh guards (placeholder secrets, env mode, SHA check, shared lock)
        run: deploy/tests/test_lib.sh
      - name: fetch-images verification policy and release fallback
        run: deploy/tests/test_fetch_images.sh
      - name: release.sh with no SHA (latest green, published commit)
        run: deploy/tests/test_release_latest.sh
      - name: init-data.sh owners and modes (as root, in a container)
        run: deploy/tests/test_init_data.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.27.4', cache-dependency-path: deploy/tools/recs-backup/go.sum }
      - name: recs-backup vet, staticcheck, govulncheck, tests
        working-directory: deploy/tools/recs-backup
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go test -race -count=1 ./...
      - name: Alert rules are valid and pass their unit tests
        run: |
          promtool() {
            docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/deploy:/deploy:ro" \
              -v "$PWD/deploy/alerts:/etc/prometheus/alerts:ro" \
              prom/prometheus:v3.16.0-distroless@sha256:e8b8fb0e336fe0affce6f9ea347b11d24975465fd3ba8119420186679c3efd5f "$@"
          }
          promtool check rules /deploy/alerts/intermission.yml
          promtool check config /deploy/monitoring/prometheus.yml
          promtool test rules /deploy/tests/alerts.test.yml

  images:
    name: images (build, non-root/no-shell, edge)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build all images for this commit
        id: build
        run: |
          tag="${GITHUB_SHA:0:7}" # exactly 7, like build.sh (--short can return more)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          BUILD_JOBS=4 deploy/build.sh HEAD
          docker images --filter "reference=intermission-*:$tag"
      - name: Images run as non-root and have no shell
        run: deploy/tests/check_images.sh "${{ steps.build.outputs.tag }}"
      - name: Edge gate (headers, 413, /metrics hidden, loopback-only port)
        run: deploy/tests/check_edge.sh "${{ steps.build.outputs.tag }}"
      - name: Save the image set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag="${{ steps.build.outputs.tag }}"
          docker save $(for n in api model train web backup; do echo "intermission-$n:$tag"; done) \
            | zstd -T0 -10 -o "images-$tag.tar.zst"
          ls -l "images-$tag.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: images-${{ steps.build.outputs.tag }}
          path: images-${{ steps.build.outputs.tag }}.tar.zst
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-config, images]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build all images for this commit
        id: build
        run: |
          tag="${GITHUB_SHA:0:7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          BUILD_JOBS=4 deploy/build.sh "$GITHUB_SHA"
      - name: Images run as non-root and have no shell
        run: deploy/tests/check_images.sh "${{ steps.build.outputs.tag }}"
      - name: Edge gate (headers, 413, /metrics hidden, loopback-only port)
        run: deploy/tests/check_edge.sh "${{ steps.build.outputs.tag }}"
      - name: Push ghcr.io/nickw409/intermission-<name>:<sha>-${{ matrix.arch }}
        env:
          TAG: ${{ steps.build.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          : > "digests-$ARCH.txt"
          for n in api model train web backup; do
            repo="ghcr.io/nickw409/intermission-$n"
            docker tag "intermission-$n:$TAG" "$repo:$TAG-$ARCH"
            out="$(docker push "$repo:$TAG-$ARCH")"
            digest="$(sed -n 's/.* digest: \(sha256:[0-9a-f]\{64\}\) .*/\1/p' <<<"$out")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest from push of $repo"; exit 1; }
            echo "$n $digest" >> "digests-$ARCH.txt"
          done
          docker logout ghcr.io
          cat "digests-$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests-${{ matrix.arch }}.txt
          retention-days: 7
          if-no-files-found: error

  sign:
    name: publish (multi-arch index, cosign signature)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with: { cosign-release: v3.1.4 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: digests-*, merge-multiple: true }
      - name: Create each image index from the pushed digests, sign it, verify it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_SHA:0:7}"
          digest_of() { # digest_of <arch> <name>: the digest publish pushed, or fail
            local d
            d="$(awk -v n="$2" '$1 == n { print $2 }' "digests-$1.txt")"
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no $1 digest for $2" >&2; return 1; }
            echo "$d"
          }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "| image | index digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for n in api model train web backup; do
            repo="ghcr.io/nickw409/intermission-$n"
            amd="$(digest_of amd64 "$n")"
            arm="$(digest_of arm64 "$n")"
            docker buildx imagetools create --tag "$repo:$tag" "$repo@$amd" "$repo@$arm"
            digest="$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest for $repo:$tag: $digest"; exit 1; }
            # The index must list exactly the two digests publish pushed (the :tag read above
            # could have been moved by someone else in between).
            children="$(docker buildx imagetools inspect "$repo@$digest" --raw | jq -r '[.manifests[].digest] | sort | join(" ")')"
            [[ "$children" == "$(printf '%s\n' "$amd" "$arm" | sort | paste -sd' ')" ]] \
              || { echo "index $repo@$digest does not hold the pushed digests: $children"; exit 1; }
            cosign sign --yes "$repo@$digest"
            # Same policy as deploy/fetch-images.sh: what is published here must verify there.
            cosign verify \
              --certificate-identity "https://github.com/nickw409/intermission/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository nickw409/intermission \
              --certificate-github-workflow-ref refs/heads/main \
              --certificate-github-workflow-trigger push \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              "$repo@$digest" > /dev/null
            echo "| intermission-$n:$tag | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          docker logout ghcr.io
