# Prometheus for the optional `monitoring` compose profile.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yml

# Notifications: Prometheus evaluates the rules below and shows firing alerts at
# http://127.0.0.1:9090/alerts. Delivering them (push, email) needs an Alertmanager receiver
# chosen by the owner; see deploy/runbooks/monitoring.md.

scrape_configs:
  # recs-api serves /metrics on its internal listener (backend network only; Caddy never
  # proxies /metrics). Also the "site down" signal.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8081"]

  # Host disk usage plus the nightly jobs' status (textfile collector, written by
  # deploy/nightly.sh).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # recs-model listens only on its Unix socket (network_mode: none), which Prometheus cannot
  # scrape. Its metrics become visible once recs-model gains a metrics listener or recs-api
  # relays them; until then model health shows through api's /healthz and model-client errors.
