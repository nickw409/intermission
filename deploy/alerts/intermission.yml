# Alert rules for the spec's alerts ("Operations: deploy, observe, recover"):
#   site down 5 min; 5xx > 1% over 10 min; /api/recommend p99 > 250 ms over 10 min;
#   nightly export, retrain or backup failed (plus: restore drill failed or >35 days old); disk > 85%.
#
# Metric names this file expects (reconcile with recs-api when its /metrics lands):
#   recs_api_http_requests_total{route, code}             counter, route = ServeMux pattern
#   recs_api_http_request_duration_seconds_bucket{route}  histogram
#   intermission_job_last_status{task}                    0 = ok, 1 = failed   (deploy/nightly.sh)
#   intermission_job_last_success_timestamp_seconds{task}                       (deploy/nightly.sh)
#   node_filesystem_*                                     node-exporter
# The public /healthz is also watched every 5 minutes by the external uptime monitor, which
# catches the case where this whole host (and Prometheus with it) is down.

groups:
  - name: intermission
    rules:
      - alert: SiteDown
        expr: up{job="api"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: recs-api has been unreachable for 5 minutes
          runbook: deploy/runbooks/rollback.md

      - alert: High5xxRate
        expr: |
          sum(rate(recs_api_http_requests_total{code=~"5.."}[10m]))
            / clamp_min(sum(rate(recs_api_http_requests_total[10m])), 1e-9) > 0.01
        for: 10m
        labels: { severity: page }
        annotations:
          summary: More than 1% of recs-api responses are 5xx (10-minute window)
          runbook: deploy/runbooks/rollback.md

      - alert: RecommendP99High
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(recs_api_http_request_duration_seconds_bucket{route=~"GET /api/recommend.*"}[10m]))
          ) > 0.25
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: /api/recommend p99 latency above 250 ms (10-minute window)

      # Any scheduled job whose last run failed: the nightly steps and the monthly restore drill.
      - alert: JobFailed
        expr: max by (task) (intermission_job_last_status{task=~"export|retrain|backup|restore_drill"}) != 0
        labels: { severity: warn }
        annotations:
          summary: '{{ $labels.task }} failed on its last run'
          runbook: deploy/runbooks/nightly-jobs.md

      # deploy/release.sh stopped before changing anything: the new recs-model refuses the current
      # model artifact (recs-model --check). The site is unaffected, but that release waits for a
      # retrain with its own train image. Clears when a later release passes the check or succeeds.
      - alert: RetrainRequired
        expr: max by (task) (intermission_job_last_status{task="artifact_check"}) != 0
        labels: { severity: warn }
        annotations:
          summary: 'A release is blocked: its recs-model cannot load the current model artifact (retrain first)'
          runbook: deploy/runbooks/deploy.md

      # deploy/fetch-images.sh found published images that fail signature verification (#97):
      # possible tampering, or a Sigstore outage. The release stopped before any change. Clears
      # when a release verifies its images.
      - alert: ImageVerifyRefused
        expr: max by (task) (intermission_job_last_status{task="image_verify"}) != 0
        labels: { severity: page }
        annotations:
          summary: 'A release was refused: its published images failed signature verification'
          runbook: deploy/runbooks/deploy.md

      # The serving artifact loads, but the training code (lib.sh TRAINING_PATHS) differs between
      # the running release and the commit that trained it, so the site's model does not match the
      # code. Clears when a release finds them equal (after a retrain, re-run deploy/release.sh
      # with the running SHA).
      - alert: RetrainRecommended
        expr: max by (task) (intermission_job_last_status{task="artifact_freshness"}) != 0
        labels: { severity: info }
        annotations:
          summary: 'The serving model artifact was trained by different training code (retrain recommended)'
          runbook: deploy/runbooks/deploy.md

      - alert: NightlyJobStale
        expr: time() - max by (task) (intermission_job_last_success_timestamp_seconds{task=~"export|retrain|backup"}) > 36 * 3600
        labels: { severity: warn }
        annotations:
          summary: 'Nightly {{ $labels.task }} has not succeeded for 36 hours'
          runbook: deploy/runbooks/nightly-jobs.md

      # The drill runs monthly; 35 days allows one late run before alerting.
      - alert: RestoreDrillStale
        expr: time() - max by (task) (intermission_job_last_success_timestamp_seconds{task="restore_drill"}) > 35 * 86400
        labels: { severity: warn }
        annotations:
          summary: 'The restore drill has not passed for 35 days'
          runbook: deploy/runbooks/restore.md

      - alert: DiskAbove85Percent
        expr: |
          1 - node_filesystem_avail_bytes{fstype=~"ext[234]|xfs|btrfs|zfs"}
            / node_filesystem_size_bytes{fstype=~"ext[234]|xfs|btrfs|zfs"} > 0.85
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: 'Disk {{ $labels.mountpoint }} is more than 85% full'
